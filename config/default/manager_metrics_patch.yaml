# This patch was originally intended to add --metrics-bind-address=:8443 via
# JSON Patch. The arg is now set directly in config/manager/manager.yaml to
# avoid silent kustomize patch failures. This file is kept as a no-op
# placeholder referenced by config/default/kustomization.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
spec:
  template:
    spec:
      containers:
      - name: manager
        ports:
        - containerPort: 8443
          name: metrics
          protocol: TCP
