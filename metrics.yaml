metrics:
  - name: slice_provisioner_reconciliation_errors_total
    description: Total number of slice provisioner reconciliation errors.
    type: Counter
    units: count
    labels:
      - name: error_type
        description: The operation that failed during reconciliation.
        examples:
          - GetStatefulSetError
          - DeleteSliceError
          - RemoveFinalizerError
          - AddFinalizerError
          - GetSliceError
          - GetPriorityClassError
          - CreateSliceError

  - name: slice_provisioner_slice_operations_total
    description: Total number of slice operations (creation/deletion) attempted by the provisioner.
    type: Counter
    units: count
    labels:
      - name: operation
        description: The operation performed.
        examples:
          - Create
          - Delete
      - name: status
        description: The result of the operation.
        examples:
          - Success
          - Error

  - name: slice_provisioner_slice_creation_processing_milliseconds
    description: Time taken to process a StatefulSet and create a Slice in milliseconds (measured from the workload creation timestamp to successful slice creation).
    type: Histogram
    units: milliseconds
