# Default values for slice-provisioner.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

global:
  # A parent chart can override this. Leave empty for local fallback.
  imageRegistry: ""
  enablePrometheusMonitoring: false

metrics:
  enabled: true
  tls: false
  port: 8080

webhook:
  enabled: true
  port: 9443
  secretName: webhook-server-cert
  caBundle: ""
  autoGenerateCert: true

image:
  repository: slice-provisioner
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # tag: "0.7.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "slice-provisioner-controller-manager"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - "ALL"
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: "RuntimeDefault"

resources:
  limits:
    # Recommend only setting cpu limit when running directly on control-plane nodes.
    # cpu: 2
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

priorityClassName: system-cluster-critical

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: slice-provisioner
        topologyKey: kubernetes.io/hostname

debug:
  enabled: false
  level: 1

enableKueueAdmission: false
