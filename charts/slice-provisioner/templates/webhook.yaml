{{- if .Values.webhook.enabled }}
{{- $ca := "" -}}
{{- $cert := "" -}}
{{- $caBundle := .Values.webhook.caBundle -}}
{{- $secretName := .Values.webhook.secretName -}}

{{- if .Values.webhook.autoGenerateCert }}
  {{- $serviceName := printf "%s-webhook-service" (include "slice-provisioner.fullname" .) -}}
  {{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
  {{- if $existingSecret }}
    {{- $ca = dict "Cert" (index $existingSecret.data "ca.crt" | b64dec) -}}
    {{- $cert = dict "Cert" (index $existingSecret.data "tls.crt" | b64dec) "Key" (index $existingSecret.data "tls.key" | b64dec) -}}
  {{- else }}
    {{- $ca = genCA "webhook-ca" 3650 -}}
    {{- $cert = genSignedCert $serviceName nil (list (printf "%s.%s.svc" $serviceName .Release.Namespace)) 3650 $ca -}}
  {{- end }}
  {{- $caBundle = $ca.Cert | b64enc -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "slice-provisioner.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "slice-provisioner.fullname" . }}-webhook-service
  labels:
    {{- include "slice-provisioner.labels" . | nindent 4 }}
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: {{ .Values.webhook.port }}
  selector:
    {{- include "slice-provisioner.selectorLabels" . | nindent 4 }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "slice-provisioner.fullname" . }}-mutating-webhook-configuration
  labels:
    {{- include "slice-provisioner.labels" . | nindent 4 }}
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      caBundle: {{ $caBundle }}
      service:
        name: {{ include "slice-provisioner.fullname" . }}-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /mutate-batch-v1-job
    failurePolicy: Fail
    name: mjob.kb.io
    namespaceSelector:
      matchLabels:
        slice-provisioner.gke.io/enabled: "true"
    rules:
      - apiGroups:
          - batch
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - jobs
    sideEffects: None
    timeoutSeconds: 10
  - admissionReviewVersions:
      - v1
    clientConfig:
      caBundle: {{ $caBundle }}
      service:
        name: {{ include "slice-provisioner.fullname" . }}-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /mutate-apps-v1-statefulset
    failurePolicy: Fail
    name: mstatefulset.kb.io
    namespaceSelector:
      matchLabels:
        slice-provisioner.gke.io/enabled: "true"
    rules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - statefulsets
    sideEffects: None
    timeoutSeconds: 10
  - admissionReviewVersions:
      - v1
    clientConfig:
      caBundle: {{ $caBundle }}
      service:
        name: {{ include "slice-provisioner.fullname" . }}-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /mutate--v1-pod
    failurePolicy: Fail
    name: mpod.kb.io
    namespaceSelector:
      matchLabels:
        slice-provisioner.gke.io/enabled: "true"
    # Only LWS Pods that opted in via slice-prefix reach the webhook, so an outage
    # cannot block Pod creation for anything else in an enabled namespace.
    objectSelector:
      matchExpressions:
        - key: leaderworkerset.sigs.k8s.io/name
          operator: Exists
        - key: cloud.google.com/slice-prefix
          operator: Exists
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
    sideEffects: None
    timeoutSeconds: 10
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "slice-provisioner.fullname" . }}-validating-webhook-configuration
  labels:
    {{- include "slice-provisioner.labels" . | nindent 4 }}
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      caBundle: {{ $caBundle }}
      service:
        name: {{ include "slice-provisioner.fullname" . }}-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /validate-apps-v1-statefulset
    failurePolicy: Fail
    name: vworkload.kb.io
    namespaceSelector:
      matchLabels:
        slice-provisioner.gke.io/enabled: "true"
    rules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - statefulsets
    sideEffects: None
    timeoutSeconds: 10
  - admissionReviewVersions:
      - v1
    clientConfig:
      caBundle: {{ $caBundle }}
      service:
        name: {{ include "slice-provisioner.fullname" . }}-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /validate-jobset-x-k8s-io-v1alpha2-jobset
    failurePolicy: Fail
    name: vjobset.kb.io
    namespaceSelector:
      matchLabels:
        slice-provisioner.gke.io/enabled: "true"
    rules:
      - apiGroups:
          - jobset.x-k8s.io
        apiVersions:
          - v1alpha2
        operations:
          - CREATE
          - UPDATE
        resources:
          - jobsets
    sideEffects: None
    timeoutSeconds: 10
{{- end }}
