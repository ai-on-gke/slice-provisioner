{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: slice-provisioner-manager-metrics-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slice-provisioner.labels" . | nindent 4 }}
spec:
  ports:
    - name: metrics
      targetPort: metrics # reference the deployment's metrics port by name
      port: {{ .Values.metrics.port }}
      protocol: TCP
  selector:
    {{- include "slice-provisioner.selectorLabels" . | nindent 4 }}
{{- end }}